# Edge proxy shared by every lab (one instance per lab, never shared).
# Pure L4 (TCP) forwarding: no HTTP rewriting, TLS passes through untouched.
# Per-lab listeners are rendered by the official nginx entrypoint from
# /etc/nginx/templates/*.stream-template into /etc/nginx/stream-conf.d/.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

stream {
    # Docker embedded DNS: re-resolve upstreams so a restarted app container
    # (new IP) keeps working. Never resolves external names (internal nets).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format lab '$remote_addr [$time_local] $server_port -> $upstream_addr '
                   '$status sent=$bytes_sent recv=$bytes_received $session_time';
    access_log /dev/stdout lab;

    proxy_connect_timeout 5s;

    include /etc/nginx/stream-conf.d/*.conf;
}
