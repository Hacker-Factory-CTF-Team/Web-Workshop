# CI for the local web pentesting lab.
#   lint        static checks (shell, Python, PowerShell when present)
#   unit        unittest suite incl. the security policy on the rendered Compose files
#   integration real deployment on the runner with an emulated Host-only NIC and
#               Kali/LAN network namespaces (tests/network/linux-validation-session.sh)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bash syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh'; echo manager)
          for f in "${files[@]}"; do
            if head -n1 "$f" | grep -q bash; then bash -n "$f"; fi
          done
      - name: ShellCheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh'; echo manager)
          shellcheck --severity=warning --external-sources "${files[@]}"
      - name: Python byte-compile (3.10 syntax floor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m compileall -q src tests
      - name: JSON files are valid
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.json'); do python -m json.tool "$f" > /dev/null; done
      - name: PSScriptAnalyzer
        if: hashFiles('**/*.ps1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Docker Compose version (needed by tests/security)
        run: docker compose version
      - name: unittest
        run: python -m unittest discover -s tests -t . -v

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host information
        run: |
          docker version
          docker compose version
          sudo iptables --version
          ip -br addr
      - name: Validation session (emulated Host-only NIC + Kali/LAN netns)
        run: bash tests/network/linux-validation-session.sh
        env:
          PLAB_SUDOERS: "yes"
      - name: Stop labs and clean up
        if: always()
        run: |
          ./manager stop all || true
          ASSUME_YES=1 scripts/linux/install.sh --phase uninstall --yes || true
          sudo tests/network/linux-netns.sh cleanup || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-logs
          path: state/*.log
          if-no-files-found: ignore
